<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Degelab Filament</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff}header{position:sticky;top:0;background:#111827eF;backdrop-filter:blur(10px);padding:16px 18px;border-bottom:1px solid #27324a}h1{font-size:21px;margin:0}.sub{font-size:12px;color:#9ca3af;margin-top:3px}main{max-width:780px;margin:auto;padding:16px}.card{background:#141b2d;border:1px solid #26324b;border-radius:18px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:block;font-size:12px;color:#aab4c8;margin:10px 0 5px}input,select,textarea,button{width:100%;border-radius:12px;border:1px solid #34415e;background:#0e1526;color:#fff;padding:12px;font-size:15px}textarea{min-height:70px}button{border:0;background:#4f46e5;font-weight:700;cursor:pointer;margin-top:10px}.secondary{background:#25314a}.danger{background:#7f1d1d}.nfc{background:#047857}.nfc:disabled{opacity:.65;cursor:wait}.toolbar{display:flex;gap:8px}.toolbar button{margin:0}.item{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #26324b}.item:last-child{border:0}.dot{width:18px;height:18px;border-radius:50%;border:1px solid #64748b}.muted{color:#9ca3af;font-size:13px}.badge{font-size:12px;background:#27324a;padding:5px 8px;border-radius:999px}.hidden{display:none}.notice{font-size:13px;padding:10px;border-radius:10px;background:#1f2937;margin-top:10px}.titleline{display:flex;justify-content:space-between;gap:10px;align-items:center}.titleline h2{margin:0;font-size:18px}
</style></head><body><header><h1>🧵 Degelab Filament</h1><div class="sub">Gestion simple de tes profils filament + NFC</div></header><main>
<section id="listView"><div class="card"><div class="titleline"><h2>Mes filaments</h2><span id="count" class="badge">0</span></div><button onclick="newFilament()">＋ Nouveau filament</button></div><div id="list" class="card"></div></section>
<section id="editView" class="hidden"><div class="card"><div class="titleline"><h2 id="formTitle">Nouveau filament</h2><button class="secondary" style="width:auto;margin:0" onclick="showList()">← Retour</button></div><input id="id" type="hidden"><div class="row"><div><label>Marque</label><input id="brand" placeholder="SUNLU, Overture…"></div><div><label>Matière</label><select id="material"><option>PLA</option><option>PETG</option><option>ABS</option><option>ASA</option><option>TPU</option><option>PA</option><option>PC</option><option>Autre</option></select></div></div><div class="row"><div><label>Gamme / référence</label><input id="range" placeholder="PETG Basic…"></div><div><label>Couleur</label><input id="colorName" placeholder="Rouge"></div></div><div class="row"><div><label>Couleur visuelle</label><input id="color" type="color" value="#ff0000"></div><div><label>Diamètre (mm)</label><input id="diameter" type="number" step="0.01" value="1.75"></div></div><div class="row"><div><label>Température buse (°C)</label><input id="nozzle" type="number" placeholder="235"></div><div><label>Température plateau (°C)</label><input id="bed" type="number" placeholder="70"></div></div><div class="row"><div><label>Flow Ratio</label><input id="flow" type="number" step="0.001" placeholder="0.98"></div><div><label>Flow Dynamics K</label><input id="k" type="number" step="0.001" placeholder="0.025"></div></div><div><label>Débit volumétrique max (mm³/s)</label><input id="mvs" type="number" step="0.1" placeholder="12"></div><label>Notes</label><textarea id="notes" placeholder="Résultats de calibration, remarques…"></textarea><button onclick="save()">💾 Enregistrer</button><button id="nfcBtn" class="nfc hidden" onclick="writeNFC()">📡 Écrire sur la puce NFC</button><button id="deleteBtn" class="danger hidden" onclick="removeCurrent()">Supprimer</button><div id="msg"></div></div></section>
</main><script>
const KEY='degelab_filaments_v1';const $=id=>document.getElementById(id);let current=null;
function all(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function store(v){localStorage.setItem(KEY,JSON.stringify(v))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function showList(){ $('editView').classList.add('hidden');$('listView').classList.remove('hidden');render() }
function render(){let a=all();$('count').textContent=a.length;$('list').innerHTML=a.length?a.map(f=>`<div class="item" onclick="edit('${f.id}')"><span class="dot" style="background:${f.color||'#777'}"></span><div><b>${esc(f.brand)} ${esc(f.material)}</b><div class="muted">${esc(f.range)}${f.colorName?' • '+esc(f.colorName):''}</div></div><span class="badge">${f.nozzle?f.nozzle+'°C':'ouvrir'}</span></div>`).join(''):'<div class="muted">Aucun filament enregistré.</div>'}
function clearForm(){['brand','range','colorName','nozzle','bed','flow','k','mvs','notes'].forEach(x=>$(x).value='');$('material').value='PLA';$('diameter').value='1.75';$('color').value='#ff0000'}
function newFilament(){current=null;clearForm();$('formTitle').textContent='Nouveau filament';$('nfcBtn').classList.add('hidden');$('deleteBtn').classList.add('hidden');openForm()}
function openForm(){$('listView').classList.add('hidden');$('editView').classList.remove('hidden');$('msg').innerHTML=''}
function edit(id){let f=all().find(x=>x.id===id);if(!f)return;current=id;for(let x of ['brand','material','range','colorName','color','diameter','nozzle','bed','flow','k','mvs','notes'])$(x).value=f[x]??'';$('formTitle').textContent='Fiche filament';$('nfcBtn').classList.remove('hidden');$('deleteBtn').classList.remove('hidden');openForm()}
function save(){let id=current||('F'+Date.now().toString(36));let f={id};for(let x of ['brand','material','range','colorName','color','diameter','nozzle','bed','flow','k','mvs','notes'])f[x]=$(x).value;let a=all(),i=a.findIndex(x=>x.id===id);if(i<0)a.unshift(f);else a[i]=f;store(a);current=id;$('formTitle').textContent='Fiche filament';$('nfcBtn').classList.remove('hidden');$('deleteBtn').classList.remove('hidden');note('✅ Filament enregistré.');}
function removeCurrent(){if(!current||!confirm('Supprimer ce filament ?'))return;store(all().filter(x=>x.id!==current));showList()}
function note(t){$('msg').innerHTML=`<div class="notice">${t}</div>`}
let nfcWriting=false;
async function writeNFC(){
  if(!current||nfcWriting)return;
  const btn=$('nfcBtn');
  const url=location.origin+location.pathname+'?filament='+encodeURIComponent(current);

  if(!('NDEFReader' in window)){
    note('❌ Web NFC n’est pas disponible dans ce navigateur. Utilise Chrome sur Android.');
    return;
  }

  nfcWriting=true;
  btn.disabled=true;
  const oldText=btn.textContent;
  btn.textContent='📡 Approche la puce NFC…';

  try{
    const ndef=new NDEFReader();
    note('📡 Approche la puce NFC et garde-la contre le téléphone jusqu’à la confirmation…');
    await ndef.write({
      records:[{
        recordType:'url',
        data:url
      }]
    });
    note('✅ Puce NFC écrite ! Elle ouvrira cette fiche.');
  }catch(e){
    const msg=String(e && e.message ? e.message : e);
    if(/not supported/i.test(msg)){
      try{await navigator.clipboard.writeText(url)}catch(_){}
      note('❌ Cette puce n’est pas accessible en écriture par Web NFC. Le lien de la bobine a été copié pour pouvoir l’écrire avec une application NFC compatible. Ce blocage vient du type/format de la puce, pas des données Degelab.');
    }else if(/new push request|cancelled/i.test(msg)){
      note('❌ Écriture interrompue. Appuie une seule fois puis garde la puce contre le téléphone.');
    }else{
      note('❌ Écriture annulée ou impossible : '+esc(msg));
    }
  }finally{
    nfcWriting=false;
    btn.disabled=false;
    btn.textContent=oldText;
  }
}
function loadFromUrl(){let id=new URLSearchParams(location.search).get('filament');if(id&&all().some(x=>x.id===id))edit(id);else render()}loadFromUrl();
</script></body></html>
